<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated 3D Fly Viewer</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00aaff, 1.5, 50);
        pointLight.position.set(-10, -10, -10);
        scene.add(pointLight);

        // Fly Group Hierarchy
        const flyGroup = new THREE.Group();
        const flyBody = new THREE.Group();
        flyGroup.add(flyBody);
        scene.add(flyGroup);

        // Materials
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.4,
            metalness: 0.8
        });

        const eyeMaterial = new THREE.MeshStandardMaterial({
            color: 0xaa1100,
            roughness: 0.2,
            metalness: 0.1
        });

        const wingMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transmission: 0.9,
            opacity: 1,
            transparent: true,
            roughness: 0.1,
            ior: 1.5,
            side: THREE.DoubleSide
        });

        // 1. Thorax / Body Center
        const thoraxGeo = new THREE.SphereGeometry(1.2, 16, 16);
        thoraxGeo.scale(1, 0.9, 1.3);
        const thorax = new THREE.Mesh(thoraxGeo, bodyMaterial);
        flyBody.add(thorax);

        // 2. Abdomen
        const abdomenGeo = new THREE.SphereGeometry(1.6, 16, 16);
        abdomenGeo.scale(1, 0.9, 1.8);
        const abdomen = new THREE.Mesh(abdomenGeo, bodyMaterial);
        abdomen.position.set(0, -0.2, -2.4);
        flyBody.add(abdomen);

        // 3. Head & Compound Eyes
        const headGeo = new THREE.SphereGeometry(0.9, 16, 16);
        headGeo.scale(1.1, 0.9, 0.9);
        const head = new THREE.Mesh(headGeo, bodyMaterial);
        head.position.set(0, 0.2, 1.5);
        flyBody.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.5, 16, 16);
        eyeGeo.scale(0.8, 1.2, 1);

        const leftEye = new THREE.Mesh(eyeGeo, eyeMaterial);
        leftEye.position.set(0.6, 0.3, 1.7);
        leftEye.rotation.y = 0.3;
        flyBody.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMaterial);
        rightEye.position.set(-0.6, 0.3, 1.7);
        rightEye.rotation.y = -0.3;
        flyBody.add(rightEye);

        // 4. Wings (Pivoted for high-frequency flapping)
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.quadraticCurveTo(1.5, 2, 0.8, 4.5);
        wingShape.quadraticCurveTo(0, 5, -0.5, 4);
        wingShape.quadraticCurveTo(-0.8, 2, 0, 0);

        const wingGeo = new THREE.ShapeGeometry(wingShape);

        // Left Wing Pivot
        const leftWingGroup = new THREE.Group();
        leftWingGroup.position.set(0.8, 0.8, 0);
        const leftWingMesh = new THREE.Mesh(wingGeo, wingMaterial);
        leftWingMesh.rotation.x = Math.PI / 2;
        leftWingMesh.rotation.y = -Math.PI / 6;
        leftWingGroup.add(leftWingMesh);
        flyBody.add(leftWingGroup);

        // Right Wing Pivot
        const rightWingGroup = new THREE.Group();
        rightWingGroup.position.set(-0.8, 0.8, 0);
        const rightWingMesh = new THREE.Mesh(wingGeo, wingMaterial);
        rightWingMesh.rotation.x = Math.PI / 2;
        rightWingMesh.rotation.y = Math.PI / 6;
        rightWingGroup.add(rightWingMesh);
        flyBody.add(rightWingGroup);

        const clock = new THREE.Clock();

        // Animation Loop: Handles Wing Flapping & Flight Path Dynamics
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // High-Frequency Wing Flapping (Rapid Z-rotation oscillating around pivot)
            const flapSpeed = 45;
            const flapAngle = Math.sin(elapsedTime * flapSpeed) * 0.6;
            leftWingGroup.rotation.z = flapAngle;
            rightWingGroup.rotation.z = -flapAngle;

            // Spatial Flight Trajectory Motion (Oscillating 3D Path)
            flyGroup.position.x = Math.sin(elapsedTime * 1.2) * 8;
            flyGroup.position.y = Math.sin(elapsedTime * 2.4) * 2 + 3;
            flyGroup.position.z = Math.cos(elapsedTime * 1.2) * 8;

            // Pitch, Yaw, and Roll to Align with Motion Vector
            flyGroup.rotation.y = elapsedTime * 1.2 + Math.PI / 2;
            flyGroup.rotation.z = Math.sin(elapsedTime * 2.4) * 0.15;
            flyGroup.rotation.x = Math.cos(elapsedTime * 2.4) * 0.1;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
