<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated 3D Fly Viewer</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Overlay UI Card */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px;
            border-radius: 12px;
            color: #ffffff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 180px;
            z-index: 10;
        }
        .ui-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .ui-label {
            color: #aaaaaa;
            font-weight: 500;
        }
        .ui-value {
            font-weight: bold;
            color: #00ffcc;
        }
        #feed-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 180, 219, 0.3);
        }
        #feed-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 180, 219, 0.5);
        }
        #feed-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- UI Overlay for Mood and Feeding -->
    <div id="ui-panel">
        <div class="ui-row">
            <span class="ui-label">Mood:</span>
            <span id="mood-display" class="ui-value">Happy 🪰</span>
        </div>
        <button id="feed-btn">🍒 Feed Fly</button>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // Glass Enclosure Box
        const boxSize = 12;
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.25,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 1.2,
            side: THREE.DoubleSide
        });
        const glassBox = new THREE.Mesh(boxGeo, boxMat);
        scene.add(glassBox);

        // Box Wireframe Edges
        const edges = new THREE.EdgesGeometry(boxGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });
        const wireframe = new THREE.LineSegments(edges, lineMat);
        scene.add(wireframe);

        // Fly Group Hierarchy
        const flyGroup = new THREE.Group();
        const flyBody = new THREE.Group();
        flyGroup.add(flyBody);
        scene.add(flyGroup);

        // Fly Materials
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.8 });
        const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xaa1100, roughness: 0.2, metalness: 0.1 });
        const wingMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, transmission: 0.9, opacity: 0.85, transparent: true, roughness: 0.1, side: THREE.DoubleSide
        });

        // Thorax
        const thoraxGeo = new THREE.SphereGeometry(1.2, 16, 16);
        thoraxGeo.scale(1, 0.9, 1.3);
        flyBody.add(new THREE.Mesh(thoraxGeo, bodyMaterial));

        // Abdomen
        const abdomenGeo = new THREE.SphereGeometry(1.6, 16, 16);
        abdomenGeo.scale(1, 0.9, 1.8);
        const abdomen = new THREE.Mesh(abdomenGeo, bodyMaterial);
        abdomen.position.set(0, -0.2, -2.4);
        flyBody.add(abdomen);

        // Head & Eyes
        const headGeo = new THREE.SphereGeometry(0.9, 16, 16);
        headGeo.scale(1.1, 0.9, 0.9);
        const head = new THREE.Mesh(headGeo, bodyMaterial);
        head.position.set(0, 0.2, 1.5);
        flyBody.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.5, 16, 16);
        eyeGeo.scale(0.8, 1.2, 1);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMaterial);
        leftEye.position.set(0.6, 0.3, 1.7);
        leftEye.rotation.y = 0.3;
        flyBody.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMaterial);
        rightEye.position.set(-0.6, 0.3, 1.7);
        rightEye.rotation.y = -0.3;
        flyBody.add(rightEye);

        // Wings
        const leftWingShape = new THREE.Shape();
        leftWingShape.moveTo(0, 0);
        leftWingShape.quadraticCurveTo(2, 1.5, 4.5, 0.8);
        leftWingShape.quadraticCurveTo(5, 0, 4, -0.5);
        leftWingShape.quadraticCurveTo(2, -0.8, 0, 0);

        const leftWingGroup = new THREE.Group();
        leftWingGroup.position.set(0.8, 0.8, 0.2);
        leftWingGroup.add(new THREE.Mesh(new THREE.ShapeGeometry(leftWingShape), wingMaterial));
        flyBody.add(leftWingGroup);

        const rightWingShape = new THREE.Shape();
        rightWingShape.moveTo(0, 0);
        rightWingShape.quadraticCurveTo(-2, 1.5, -4.5, 0.8);
        rightWingShape.quadraticCurveTo(-5, 0, -4, -0.5);
        rightWingShape.quadraticCurveTo(-2, -0.8, 0, 0);

        const rightWingGroup = new THREE.Group();
        rightWingGroup.position.set(-0.8, 0.8, 0.2);
        rightWingGroup.add(new THREE.Mesh(new THREE.ShapeGeometry(rightWingShape), wingMaterial));
        flyBody.add(rightWingGroup);

        // Interactive Mood Logic
        const moods = ['Happy 🪰', 'Excited 🎉', 'Well-Fed 😋', 'Energetic ⚡', 'Playful 🎈'];
        const moodDisplay = document.getElementById('mood-display');
        const feedBtn = document.getElementById('feed-btn');

        feedBtn.addEventListener('click', () => {
            const randomMood = moods[Math.floor(Math.random() * moods.length)];
            moodDisplay.innerText = randomMood;
            
            // Temporary bounce effect on feed
            flyGroup.position.y += 1.5;
        });

        const clock = new THREE.Clock();

        // Animation Loop: Bound within Glass Enclosure
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Wing Flapping
            const flapAngle = Math.sin(elapsedTime * 45) * 0.5;
            leftWingGroup.rotation.z = flapAngle;
            rightWingGroup.rotation.z = -flapAngle;

            // Trajectory constrained within the 12x12x12 glass box boundaries
            const bounds = (boxSize / 2) - 2;
            flyGroup.position.x = Math.sin(elapsedTime * 1.5) * bounds;
            flyGroup.position.y = Math.sin(elapsedTime * 2.8) * (bounds * 0.5);
            flyGroup.position.z = Math.cos(elapsedTime * 1.5) * bounds;

            // Orientations aligned to internal trajectory
            flyGroup.rotation.y = elapsedTime * 1.5 + Math.PI / 2;
            flyGroup.rotation.z = Math.sin(elapsedTime * 2.8) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
