        // Initialize Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting Configuration
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        let mixer;
        let flyGroup = new THREE.Group();
        scene.add(flyGroup);
        const clock = new THREE.Clock();

        // Load glTF Data Payload
        const jsonString = JSON.stringify(gltfData);
        const gltfBlob = new Blob([jsonString], { type: 'application/json' });
        const gltfUrl = URL.createObjectURL(gltfBlob);

        const loader = new GLTFLoader();
        loader.load(
            gltfUrl,
            (gltf) => {
                const model = gltf.scene;
                flyGroup.add(model);

                // Auto-fit camera position
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);

                // Initialize Animation Mixer
                mixer = new THREE.AnimationMixer(model);
                if (gltf.animations && gltf.animations.length) {
                    gltf.animations.forEach((clip) => {
                        const action = mixer.clipAction(clip);
                        action.timeScale = 15; // Speed up animation to simulate high wing-beat rate
                        action.play();
                    });
                }

                document.getElementById('loading').style.display = 'none';
            },
            undefined,
            (error) => {
                console.error('Model loading failed:', error);
                document.getElementById('loading').innerText = 'Failed to load model.';
            }
        );

        // Animation Loop with Flying Flight-Path Simulation
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Internal wing-flapping armature updater
            if (mixer) mixer.update(delta);

            // Flying trajectory path (3D spatial motion simulation)
            if (flyGroup) {
                flyGroup.position.x = Math.sin(time * 1.5) * 12;
                flyGroup.position.y = Math.cos(time * 2.5) * 4 + 5;
                flyGroup.position.z = Math.cos(time * 1.5) * 12;

                // Rotations aligned with travel vector
                flyGroup.rotation.y = time * 1.5 + Math.PI / 2;
                flyGroup.rotation.z = Math.sin(time * 2.5) * 0.2;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive viewport handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
