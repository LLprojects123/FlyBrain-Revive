<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated 3D Fly Viewer</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: Arial, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.65);
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }
        .status-row {
            font-size: 16px;
            font-weight: bold;
        }
        #mood-text {
            color: #00ffcc;
        }
        button {
            padding: 10px 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #218838;
        }
        #status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="status-row">Mood: <span id="mood-text">Hungry (0/10)</span></div>
        <button id="feed-btn">Feed Fly</button>
    </div>

    <div id="status-msg">Loading Model...</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const statusMsg = document.getElementById('status-msg');
        const moodText = document.getElementById('mood-text');
        const feedBtn = document.getElementById('feed-btn');

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // Glass Enclosure Box
        const boxSize = 22;
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            transmission: 0.9,
            side: THREE.DoubleSide
        });
        const glassBox = new THREE.Mesh(boxGeo, boxMat);
        scene.add(glassBox);

        const edges = new THREE.EdgesGeometry(boxGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });
        scene.add(new THREE.LineSegments(edges, lineMat));

        // State & Feed logic
        let feedCount = 0;
        function updateMood() {
            if (feedCount === 0) moodText.innerText = "Hungry (0/10)";
            else if (feedCount < 5) moodText.innerText = `Content (${feedCount}/10)`;
            else if (feedCount < 10) moodText.innerText = `Happy (${feedCount}/10)`;
            else moodText.innerText = `Ecstatic! (${feedCount}/10)`;
        }

        feedBtn.addEventListener('click', () => {
            feedCount++;
            updateMood();
        });

        // GLTF Loading Routine
        let mixer;
        const loader = new GLTFLoader();

        // Path sanitized without '#' character
        const modelPath = './fly_0000/final_rig/scene.gltf';

        loader.load(
            modelPath,
            (gltf) => {
                statusMsg.style.display = 'none';
                const model = gltf.scene;
                scene.add(model);

                // Auto-center and scale model within the box
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 8 / maxDim;
                    model.scale.set(scale, scale, scale);
                }

                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                }
            },
            undefined,
            (error) => {
                console.error(error);
                statusMsg.innerText = "Failed to load model.\nEnsure folder 'fly#0000' is renamed to 'fly_0000'.";
            }
        );

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
