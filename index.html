<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated 3D Fly Viewer</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        button {
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div>Mood: <span id="mood-text">Neutral</span></div>
        <button id="feed-btn">Feed</button>
    </div>

    <div id="loading-text">Loading Model...</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene
        const container = document.getElementById('canvas-container');
        const loadingText = document.getElementById('loading-text');
        const moodText = document.getElementById('mood-text');
        const feedBtn = document.getElementById('feed-btn');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // Glass Box Enclosure
        const boxSize = 20;
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            transmission: 0.9,
            side: THREE.DoubleSide
        });
        const glassBox = new THREE.Mesh(boxGeo, boxMat);
        scene.add(glassBox);

        const edges = new THREE.EdgesGeometry(boxGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });
        const wireframe = new THREE.LineSegments(edges, lineMat);
        scene.add(wireframe);

        // Model & Mixer
        let mixer;
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Load original GLTF file (encodes URL special characters correctly)
        const loader = new GLTFLoader();
        const modelPath = 'fly%230000/final_rig/scene.gltf';

        loader.load(
            modelPath,
            (gltf) => {
                loadingText.style.display = 'none';
                const model = gltf.scene;
                modelGroup.add(model);

                // Auto-fit loaded model scale inside enclosure
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 6 / maxDim;
                    model.scale.set(scale, scale, scale);
                }

                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }
            },
            undefined,
            (error) => {
                loadingText.innerText = 'Failed to load model.';
                console.error(error);
            }
        );

        // State / Feed Logic
        let moodValue = 50;

        function updateMoodDisplay() {
            if (moodValue > 75) moodText.innerText = 'Ecstatic';
            else if (moodValue > 40) moodText.innerText = 'Content';
            else moodText.innerText = 'Hungry';
        }

        feedBtn.addEventListener('click', () => {
            moodValue = Math.min(100, moodValue + 25);
            updateMoodDisplay();
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
