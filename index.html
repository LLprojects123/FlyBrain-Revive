<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fly Model Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 1.2rem;
            pointer-events: none;
        }
    </style>
    <!-- Import Three.js and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="loading">Loading 3D Model...</div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, mixer;
        let flyGroup;
        const clock = new THREE.Clock();

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Parent group to handle global flight path translation
            flyGroup = new THREE.Group();
            scene.add(flyGroup);

            // Camera setup
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 10, 30);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Controls setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
            fillLight.position.set(-10, -10, -10);
            scene.add(fillLight);

            // Load Fly Model
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                'fly#0000/final_rig/Fly_by_jeremy_-_f8kM9xA_5sV.glb',
                function (gltf) {
                    const model = gltf.scene;

                    // Fix flipped model orientation
                    model.rotation.x = Math.PI;
                    model.rotation.y = Math.PI;

                    // Add model inside the flying parent group
                    flyGroup.add(model);

                    // Setup mesh-level skeletal or wing animations if embedded in GLTF
                    if (gltf.animations && gltf.animations.length) {
                        mixer = new THREE.AnimationMixer(model);
                        gltf.animations.forEach((clip) => {
                            mixer.clipAction(clip).play();
                        });
                    }

                    document.getElementById('loading').style.display = 'none';
                },
                function (xhr) {
                    if (xhr.lengthComputable) {
                        const percentComplete = (xhr.loaded / xhr.total) * 100;
                        document.getElementById('loading').innerText = 
                            'Loading 3D Model... ' + Math.round(percentComplete) + '%';
                    }
                },
                function (error) {
                    console.error('An error occurred while loading the model:', error);
                    document.getElementById('loading').innerText = 'Failed to load model.';
                }
            );

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Play skeletal/wing animation clips
            if (mixer) mixer.update(delta);

            // Custom procedural flight path movement (Figure-8 / Hover effect)
            if (flyGroup) {
                const radiusX = 8;
                const radiusZ = 5;
                const speed = 1.2;

                // Position calculation along a Lissajous curve
                flyGroup.position.x = Math.sin(elapsedTime * speed) * radiusX;
                flyGroup.position.z = Math.sin(elapsedTime * speed * 2) * radiusZ;
                flyGroup.position.y = Math.sin(elapsedTime * speed * 3) * 1.5;

                // Bank/tilt into turns
                flyGroup.rotation.y = Math.atan2(
                    Math.cos(elapsedTime * speed) * radiusX,
                    Math.cos(elapsedTime * speed * 2) * radiusZ * 2
                );
                flyGroup.rotation.z = Math.cos(elapsedTime * speed * 2) * 0.15;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
